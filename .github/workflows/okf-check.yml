# Las bases de conocimiento (context/, material/, defense/evidence/) siguen OKF v0.2.
name: okf-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  okf-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PyYAML para validar el frontmatter
        run: python3 -m pip install --quiet pyyaml
      - name: Tests del validador OKF
        run: python3 -m unittest discover -s tests -p 'test_okf_check.py' -v
      - name: Bundles OKF conformes en borrador
        run: scripts/okf-check.sh
