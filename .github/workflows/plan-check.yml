name: plan-check
on: [push, pull_request]
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # El puente de entrega reutiliza el validador OKF y su parser YAML.
      - run: python3 -m pip install PyYAML pypdf
      # Los tests de la entrega renderizan anexos con pandoc.
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python3 -m unittest discover -s tests -p 'test_harness_check.py' -v
      - run: python3 scripts/harness-check.py
      - run: python3 tests/test_plan_check.py -v
      - run: python3 tests/test_build_delivery.py -v
      - run: python3 tests/test_build_defense.py -v
      - run: python3 scripts/plan-check.py --mode draft
      - run: bash scripts/build-deck.sh html
