# Red de contención: el pre-commit local es la defensa principal, porque cuando
# este workflow corre el push ya es público. Si falla, hay que purgar el dato de la
# historia (ver README, "Si se filtró algo").
name: leak-guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datos privados de Flexibility
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: scripts/leak-check.sh --all

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Binario oficial en vez de gitleaks-action: la action arma el rango
      # "<raíz>^..HEAD" en el primer push y falla porque la raíz no tiene padre.
      - name: Credenciales en toda la historia
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --verbose
